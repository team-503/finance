version: 2

updates:
    - package-ecosystem: npm
      directories:
          - /
          - /apps/*
          - /packages/*
      schedule:
          interval: weekly
      open-pull-requests-limit: 1
      groups:
          npm:
              patterns:
                  - '*'
      ignore:
          - dependency-name: typescript
            update-types:
                - version-update:semver-major

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 1
      groups:
          actions:
              patterns:
                  - '*'
